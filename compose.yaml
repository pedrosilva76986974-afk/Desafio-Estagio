name: desafio-estagio

x-api: &api
  image: desafio-estagio-api:local
  build:
    context: .
    dockerfile: DESAFIO_ESTAGIO/Dockerfile
  environment: &api-environment
    ConnectionStrings__DefaultConnection: "Server=db,1433;Database=ImdbChallenge;User Id=sa;Password=${SQL_PASSWORD:?Configure SQL_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True"
    Jwt__SigningKey: "${JWT_SIGNING_KEY:?Configure JWT_SIGNING_KEY in .env}"
    HttpsRedirection__Enabled: "false"

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD:?Configure SQL_PASSWORD in .env}"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  migrate:
    <<: *api
    command: ["--migrate", "--bootstrap-admin"]
    environment:
      <<: *api-environment
      BootstrapAdmin__Email: "${ADMIN_EMAIL:?Configure ADMIN_EMAIL in .env}"
      BootstrapAdmin__Password: "${ADMIN_PASSWORD:?Configure ADMIN_PASSWORD in .env}"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  sql-data:
