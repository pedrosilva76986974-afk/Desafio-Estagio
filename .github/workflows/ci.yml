name: API checks
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: CI-only-Password123!
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CI-only-Password123!' -C -Q 'SELECT 1' -b"
          --health-interval=10s --health-timeout=5s --health-retries=30
    env:
      TEST_SQLSERVER: Server=localhost,1433;User Id=sa;Password=CI-only-Password123!;Encrypt=True;TrustServerCertificate=True
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore DESAFIO_ESTAGIO.sln
      - run: dotnet build DESAFIO_ESTAGIO.sln --no-restore -c Release
      - run: dotnet test DESAFIO_ESTAGIO.sln --no-build -c Release --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
      - run: docker build -f DESAFIO_ESTAGIO/Dockerfile -t desafio-estagio-api:ci .
